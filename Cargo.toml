[package]
name = "russ-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A MovieBox-style terminal media browser and streamer"
license = "MIT"
repository = "https://github.com/russzw/russ-tui"
readme = "README.md"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "6.0"
